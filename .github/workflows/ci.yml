name: Backend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    # Aucun secret production — pas de DATABASE_URL Neon prod
    env:
      DATABASE_ENV: test
      NODE_ENV: test
      # URLs fictives pour prisma generate/validate uniquement
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci?schema=public
      DIRECT_URL: postgresql://ci:ci@127.0.0.1:5432/ci?schema=public
      JWT_ACCESS_SECRET: ci-test-secret-at-least-32-characters-long

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20.19.0"
          cache: npm
      - run: npm ci
      - run: npx prisma validate
      - run: npx prisma generate
      - run: npm run db:migrations:check
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run test:e2e
      - run: npm run build
